name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    # Xcode 27 image (public preview): needed for the iPhone Duo APIs.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Check the project is up to date with project.yml
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
          git diff --exit-code -- IsoTrack.xcodeproj

      - name: Run unit tests
        run: |
          cd ios
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test \
            -project IsoTrack.xcodeproj \
            -scheme IsoTrack \
            -destination "id=$UDID" \
            -only-testing:IsoTrackTests \
            CODE_SIGNING_ALLOWED=NO
